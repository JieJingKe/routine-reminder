name: routine_reminder
description: "作息提醒器：常驻托盘，一天一个环。"
publish_to: 'none'
# 与 90_交付基线/00_版本登记.md 里的交付版本一一对应。
# v0.6.5 第一层打磨 → v0.7 设置层 → v0.7.1 设置层打磨（图标/空档/版本规则）
# → v0.8 多计划表数据层（模型 / 重复规则 / v1→v2 迁移，界面未动）
# → v0.9 多计划表界面（表选择器 / 管理面板 / 单表编辑器 / 日历指派）
# → v0.9.1 浮层打磨（按钮 hover 统一变灰 / 浮层压暗遮罩）
# → v0.9.2 停留 hover（快速经过不触发 / 命中区域严格等于按钮边界）。
# 未验收前一律 v0.x；+N 是构建号，同一次交付重生构建时递增。
version: 0.11.0+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # 系统托盘：常驻入口，关掉窗口后还能回来
  #
  # 停在 0.5.x 是有意的：0.6.0 起这两个插件改走 nativeapi，编译前要先跑
  # vcvars64.bat 现场编译 C++，等于凭空多出一个"必须装 MSVC + Windows SDK"的
  # 前置条件。0.5.x 是纯 Dart FFI 调 user32/shell32，`flutter test` 也能直接跑。
  # 两者的 API 一模一样（官方专门留了 legacy 入口），以后想升随时能升。
  tray_manager: ^0.5.3
  # 窗口能力：无边框 / 置顶 / 透明 / 不进任务栏，悬浮窗要用
  window_manager: ^0.5.2
  # 本地 JSON 数据文件放在应用支持目录
  path_provider: ^2.1.4
  # 计划表备份的导入 / 导出：Windows 原生对话框、Android SAF，两端共用
  # 停在 10.x：13.x 会通过 windows_file_picker 把 win32 拉到 6.x，
  # 而悬浮窗的点击穿透用的是 win32 5.x API，不能跟着升。
  file_picker: ^10.3.2
  # 悬浮窗点击穿透：穿透状态下收不到鼠标事件，只能轮询全局光标位置
  # 来判断"鼠标是否回到圆上"，再关掉穿透恢复交互。
  screen_retriever: ^0.2.2
  # 开机自启：写 HKCU\...\Run。自己写是为了给 exe 路径加引号 ——
  # 装到带空格的目录时，拼字符串的库会把命令拆坏。
  win32_registry: ^2.0.0
  # 穿透只加 WS_EX_TRANSPARENT。window_manager 会把 WS_EX_LAYERED 一起加上，
  # 而分层窗口的首帧不一定合成得出来 —— 悬浮窗会"隐身"到鼠标扫过为止。
  win32: ^5.15.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
